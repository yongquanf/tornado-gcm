site_name: TornadoGCM
site_url: https://tornado-gcm.readthedocs.io/
site_description: Pure-PyTorch NeuralGCM with Precision-Zoned Hybrid Architecture
repo_url: https://github.com/yongquanf/tornado-gcm
repo_name: yongquanf/tornado-gcm
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.jpeg
  favicon: assets/logo.jpeg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: blue grey
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Architecture: architecture.md
  - Precision Zones: precision.md
  - API Reference: api.md
  - Development: development.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
